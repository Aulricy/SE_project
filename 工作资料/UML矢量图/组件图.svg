628.17 102.922,689.27" style="stroke:#475569;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="Backend-to-Images"/><polygon points="105.37,693.63,104.451,683.824,102.922,689.27,97.476,687.741,105.37,693.63" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="7" y="511.364" fill="#000" font-size="13" textLength="78">商品图片存取</text></g><!--link Images to DB--><!--link Statistics to Images--><!--link Statistics to DB--><g class="legend" data-source-line="54"><rect x="12" y="803.422" width="426.765" height="323.641" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="821.417" fill="#000" font-size="14" textLength="70" font-weight="700">组件与依赖</text><text x="17" y="837.714" fill="#000" font-size="14" textLength="393.694">虚线箭头 A → B 表示 A 使用 B 提供的功能，不表示时间顺序。</text><text x="17" y="854.011" fill="#000" font-size="14" textLength="362.242">业务处理为组合组件，内部五个组件属于同一 Web 应用。</text><text x="17" y="870.308" fill="#000" font-size="14" textLength="416.765">Web 界面通过 HTTP 接口使用五个业务组件，不直接操作数据库。</text><text x="17" y="886.604" fill="#000" font-size="14"> </text><text x="17" y="902.901" fill="#000" font-size="14" textLength="139.999" font-weight="700">各组件的数据访问范围</text><text x="21.45" y="921.198" fill="#000" font-size="14" textLength="28">组件</text><text x="100.35" y="921.198" fill="#000" font-size="14" textLength="56">数据访问</text><text x="21.45" y="937.495" fill="#000" font-size="14" textLength="70">用户与权限</text><text x="100.35" y="937.495" fill="#000" font-size="14" textLength="56">读写用户</text><text x="21.45" y="953.792" fill="#000" font-size="14" textLength="56">商品管理</text><text x="100.35" y="953.792" fill="#000" font-size="14" textLength="195.999">读写商品，保存与读取商品图片</text><text x="21.45" y="970.089" fill="#000" font-size="14" textLength="70">预约与交易</text><text x="100.35" y="970.089" fill="#000" font-size="14" textLength="265.999">读写预约、请求记录及需要联动更新的商品</text><text x="21.45" y="986.386" fill="#000" font-size="14" textLength="56">交易统计</text><text x="100.35" y="986.386" fill="#000" font-size="14" textLength="139.999">只读已完成预约并汇总</text><text x="21.45" y="1002.683" fill="#000" font-size="14" textLength="56">操作日志</text><text x="100.35" y="1002.683" fill="#000" font-size="14" textLength="223.999">写入与查询日志，不提供修改和删除</text><line x1="17" y1="908.203" x2="370.799" y2="908.203" style="stroke:#000;stroke-width:1;"/><line x1="17" y1="924.5" x2="370.799" y2="924.5" style="stroke:#000;stroke-width:1;"/><line x1="17" y1="940.797" x2="370.799" y2="940.797" style="stroke:#000;stroke-width:1;"/><line x1="17" y1="957.094" x2="370.799" y2="957.094" style="stroke:#000;stroke-width:1;"/><line x1="17" y1="973.391" x2="370.799" y2="973.391" style="stroke:#000;stroke-width:1;"/><line x1="17" y1="989.688" x2="370.799" y2="989.688" style="stroke:#000;stroke-width:1;"/><line x1="17" y1="1005.984" x2="370.799" y2="1005.984" style="stroke:#000;stroke-width:1;"/><line x1="17" y1="908.203" x2="17" y2="1005.984" style="stroke:#000;stroke-width:1;"/><line x1="95.9" y1="908.203" x2="95.9" y2="1005.984" style="stroke:#000;stroke-width:1;"/><line x1="370.799" y1="908.203" x2="370.799" y2="1005.984" style="stroke:#000;stroke-width:1;"/><text x="17" y="1020.979" fill="#000" font-size="14"> </text><text x="17" y="1037.276" fill="#000" font-size="14" textLength="56" font-weight="700">协作约束</text><text x="17" y="1053.573" fill="#000" font-size="14" textLength="330.899">· 各受限操作均在服务端检查身份、权限及对象归属。</text><text x="17" y="1069.87" fill="#000" font-size="14" textLength="386.899">· 日志写入仅供内部业务调用；全平台日志查询仅面向管理员。</text><text x="17" y="1086.167" fill="#000" font-size="14" textLength="288.899">· 商品与预约的联动更新使用同一数据库事务。</text><text x="17" y="1102.464" fill="#000" font-size="14" textLength="414.899">· 屏蔽商品与取消有效预约一起成功或一起回滚，商品保持已屏蔽。</text><text x="17" y="1118.761" fill="#000" font-size="14" textLength="288.899">· 图片文件保存在本地，数据库保存图片路径。</text></g><?plantuml-src ZLPRJnjN47xVNt6KFFGfD0sG41GXSRDQAGzH4waFfGy6Bs35x29xQPGsbSpTW8sT0EPY6sBYf5Ok1WB1niP