ang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(172, 109, 98)" textLength="308.15625" lengthAdjust="spacingAndGlyphs" xml:space="preserve">处理人：admin_demo　　处理时间：2026-10-27 11:00</text><text x="170" y="867.734375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(172, 109, 98)" textLength="240" lengthAdjust="spacingAndGlyphs" xml:space="preserve">原因：管理员屏蔽：商品描述包含不当内容。</text><text x="170" y="895.53125" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(172, 109, 98)" textLength="288" lengthAdjust="spacingAndGlyphs" xml:space="preserve">商品维持已屏蔽，旧预约不会因商品恢复而重新生效。</text><rect x="1020" y="226.390625" width="300" height="193.96875" rx="12" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(229, 234, 242)" stroke-width="1"/><text x="1044" y="268.390625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="600" fill="rgb(24, 35, 56)" textLength="60" lengthAdjust="spacingAndGlyphs" xml:space="preserve">处理进度</text><rect x="1048" y="293.390625" width="7" height="7" rx="3.5" fill="rgb(197,210,231)" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="1051" y="305.390625" width="1" height="46.984375" rx="0" fill="rgb(231,237,246)" fill-opacity="1" stroke="none" stroke-width="0"/><text x="1070" y="302.390625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="500" fill="rgb(99, 116, 143)" textLength="52" lengthAdjust="spacingAndGlyphs" xml:space="preserve">预约创建</text><text x="1070" y="326.1875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(153, 163, 180)" textLength="101.28125" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2026-10-27 10:00</text><rect x="1048" y="358.375" width="7" height="7" rx="3.5" fill="rgb(37,99,235)" fil