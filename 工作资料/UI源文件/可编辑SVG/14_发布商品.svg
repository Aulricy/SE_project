g SC&quot;, sans-serif" font-size="27" font-weight="700" fill="rgb(24, 35, 56)" textLength="109.203125" lengthAdjust="spacingAndGlyphs" xml:space="preserve">发布商品</text><text x="120" y="200.59375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(116, 128, 150)" textLength="195" lengthAdjust="spacingAndGlyphs" xml:space="preserve">先保存草稿，准备好后提交审核。</text><rect x="1208" y="162" width="112" height="25.1875" rx="5" fill="rgb(240,243,247)" fill-opacity="1" stroke="none" stroke-width="0"/><text x="1217" y="179" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(113, 128, 150)" textLength="94" lengthAdjust="spacingAndGlyphs" xml:space="preserve">草稿 · 仅自己可见</text><rect x="120" y="226.390625" width="877" height="728.359375" rx="12" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(229, 234, 242)" stroke-width="1"/><rect x="151" y="258.484375" width="3" height="17" rx="2" fill="rgb(37,99,235)" fill-opacity="1" stroke="none" stroke-width="0"/><text x="163" y="273.390625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="600" fill="rgb(24, 35, 56)" textLength="68" lengthAdjust="spacingAndGlyphs" xml:space="preserve">商品信息</text><text x="151" y="316.578125" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(214, 108, 100)" textLength="5.921875" lengthAdjust="spacingAndGlyphs" xml:space="preserve">*</text><text x="161.921875" y="316.578125" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(84, 97, 119)" textLength="52" lengthAdjust="spacingAndGlyphs" xml:space="preserve">商品名称</text><rect x="151" y="330.375" width="815" height="41" rx="7" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(220, 226, 236)" stroke-width="1"/><text x="164" y="356.375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" fill="rgb(154, 164, 181)" textLength="204.2099609375" lengthAdjust="spacingAndGlyphs" xml:space="preserve">例如：计算机网络教材（第8版）</text><text x="151" y="403.375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(214, 108, 100)" textLength="5.921875" lengthAdjust="spacingAndGlyphs" xml:space="preserve">*</text><text x="161.921875" y="403.375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(84, 97, 119)" textLength="52" lengthAdjust="spacingAndGlyphs" xml:space="preserve">商品分类</text><rect x="151" y="417.171875" width="397" height="41" rx="7" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(220, 226, 236)" stroke-width="1"/><text x="164" y="442.171875" font-family="Arial" font-size="13.3333" font-weight="400" fill="rgb(24, 35, 56)" textLength="66.64993286132812" lengthAdjust="spacingAndGlyphs" xml:space="preserve">请选择分类</text><text x="569" y="403.375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(214, 108, 100)" textLength="5.921875" lengthAdjust="spacingAndGlyphs" xml:space="preserve">*</text><text x="579.921875" y="403.375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(84, 97, 119)" textLength="91" lengthAdjust="spacingAndGlyphs" xml:space="preserve">商品价格（元）</text><rect x="569" y="417.171875" width="397" height="41" rx="7" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(220, 226, 236)" stroke-width="1"/><text x="582" y="443.171875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" fill="rgb(154, 164, 181)" textLength="138.3525390625" lengthAdjust="spacingAndGlyphs" xml:space="preserve">大于 0，最多两位小数</text><text x="151" y="490.171875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(214, 108, 100)" textLength="5.921875" lengthAdjust="spacingAndGlyphs" xml:space="preserve">*</text><text x="161.921875" y="490.171875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(84, 97, 119)" textLength="52" lengthAdjust="spacingAndGlyphs" xml:space="preserve">商品描述</text><rect x="151" y="503.96875" width="815" height="160" rx="7" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(220, 226, 236)" stroke-width="1"/><text x="165" y="531.96875" font-family="monospace" font-size="13.3333" font-weight="400" fill="rgb(154, 164, 181)" textLength="293.265625" lengthAdjust="spacingAndGlyphs" xml:space="preserve">说明成色、使用情况、联系方式及线下交付方式。</text><text x="151" y="692.359375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(146, 158, 175)" textLength="408" lengthAdjust="spacingAndGlyphs" xml:space="preserve">成色、联系方式和交付说明都写在描述中；发布后，未登录用户也可以看到。</text><text x="151" y="730.953125" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(84, 97, 119)" textLength="55.859375" lengthAdjust="spacingAndGlyphs" xml:space="preserve">商品图片 </text><text x="206.859375" y="730.953125" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="rgb(154, 164, 180)" textLength="52" lengthAdjust="spacingAndGlyphs" xml:space="preserve">（选填）</text><rect x="151" y="744.75" width="150" height="96" rx="7" fill="rgb(247,249,252)" fill-opacity="1" stroke="rgb(219, 226, 237)" stroke-width="1"/><text x="202" y="797.15625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(155, 166, 182)" textLength="48" lengthAdjust="spacingAndGlyphs" xml:space="preserve">暂无图片</text><rect x="318" y="750.65625" width="80" height="34" rx="7" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(220, 226, 236)" stroke-width="1"/><text x="334" y="772.0625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="500" fill="rgb(67, 80, 104)" textLength="48" lengthAdjust="spacingAndGlyphs" xml:space="preserve">选择图片</text><text x="318" y="806.65625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(146, 158, 175)" textLength="204" lengthAdjust="spacingAndGlyphs" xml:space="preserve">最多一张图片；替换会覆盖当前图片。</text><text x="318" y="828.25" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(146, 158, 175)" textLength="264.25" lengthAdjust="spacingAndGlyphs" xml:space="preserve">支持 JPG、PNG、WebP，不上传也可提交审核。</text><rect x="151" y="864.75" width="815" height="1" rx="0" fill="rgb(237, 240, 245)" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="151" y="887.75" width="82" height="40" rx="7" fill="none" fill-opacity="1" stroke="rgba(0, 0, 0, 0)" stroke-width="1"/><text x="164" y="912.546875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="500" fill="rgb(117, 129, 152)" textLength="56" lengthAdjust="spacingAndGlyphs" xml:space="preserve">返回列表</text><rect x="750" y="887.75" width="102" height="40" rx="7" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(220, 226, 236)" stroke-width="1"/><text x="773" y="912.546875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="500" fill="rgb(67, 80, 104)" textLength="56" lengthAdjust="spacingAndGlyphs" xml:space="preserve">保存草稿</text><rect x="864" y="887.75" width="102" height="40" rx="7" fill="rgb(37,99,235)" fill-opacity="1" stroke="rgb(37, 99, 235)" stroke-width="1"/><text x="887" y="912.546875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="500" fill="rgb(255, 255, 255)" textLength="56" lengthAdjust="spacingAndGlyphs" xml:space="preserve">提交审核</text><rect x="1020" y="226.390625" width="300" height="180" rx="12" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(229, 234, 242)" stroke-width="1"/><text x="1044" y="268.390625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="600" fill="rgb(24, 35, 56)" textLength="60" lengthAdjust="spacingAndGlyphs" xml:space="preserve">发布流程</text><rect x="1044" y="289.390625" width="21" height="21" rx="50" fill="rgb(238,243,252)" fill-opacity="1" stroke="none" stroke-width="0"/><text x="1051.265625" y="304.09375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" fill="rgb(115, 144, 189)" textLength="6.453125" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1</text><text x="1074" y="304.296875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(126, 139, 159)" textLength="72" lengthAdjust="spacingAndGlyphs" xml:space="preserve">填写商品信息</text><rect x="1044" y="325.390625" width="21" height="21" rx="50" fill="rgb(238,243,252)" fill-opacity="1" stroke="none" stroke-width="0"/><text x="1051.265625" y="340.09375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" fill="rgb(115, 144, 189)" textLength="6.453125" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2</text><text x="1074" y="340.296875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(126, 139, 159)" textLength="84" lengthAdjust="spacingAndGlyphs" xml:space="preserve">提交管理员审核</text><rect x="1044" y="361.390625" width="21" height="21" rx="50" fill="rgb(238,243,252)" fill-opacity="1" stroke="none" stroke-width="0"/><text x="1051.265625" y="376.09375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" fill="rgb(115, 144, 189)" textLength="6.453125" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3</text><text x="1074" y="376.296875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(126, 139, 159)" textLength="108" lengthAdjust="spacingAndGlyphs" xml:space="preserve">审核通过后公开展示</text><rect x="1020" y="424.390625" width="300" height="196.5625" rx="12" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(229, 234, 242)" stroke-width="1"/><text x="1044" y="466.390625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="600" fill="rgb(24, 35, 56)" textLength="60" lengthAdjust="spacingAndGlyphs" xml:space="preserve">填写提示</text><text x="1044" y="501.390625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(136, 149, 168)" textLength="240.5625" lengthAdjust="spacingAndGlyphs" xml:space="preserve">带 * 的项目在提交审核时必填。草稿可以暂缺</text><text x="1044" y="524.78125" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(136, 149, 168)" textLength="120" lengthAdjust="spacingAndGlyphs" xml:space="preserve">内容，稍后继续补充。</text><text x="1044" y="557.171875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(136, 149, 168)" textLength="240" lengthAdjust="spacingAndGlyphs" xml:space="preserve">一条商品记录代表一件物品，无需填写库存。</text><text x="1044" y="589.5625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(136, 149, 168)" textLength="216" lengthAdjust="spacingAndGlyphs" xml:space="preserve">已有有效预约的商品暂不能修改或下架。</text><text x="120" y="1011.75" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" fill="rgb(160, 169, 184)" textLength="427.171875" lengthAdjust="spacingAndGlyphs" xml:space="preserve">离线交互演示 · 示例商品均为虚构；本页修改仅在当前页面有效，刷新后恢复示例数据。</text><rect x="120" y="1038.34375" width="1200" height="1" rx="0" fill="rgb(230, 235, 243)" fill-opacity="1" stroke="none" stroke-width="0"/><text x="120" y="1071.34375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="500" fill="rgb(133, 144, 162)" textLength="48" lengthAdjust="spacingAndGlyphs" xml:space="preserve">二手集市</text><text x="168" y="1071.34375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(154, 163, 178)" textLength="144" lengthAdjust="spacingAndGlyphs" xml:space="preserve">　让闲置物品继续发挥价值</text><text x="1164" y="1071.34375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(154, 163, 178)" textLength="156" lengthAdjust="spacingAndGlyphs" xml:space="preserve">商品审核通过后才会公开展示</text></svg>