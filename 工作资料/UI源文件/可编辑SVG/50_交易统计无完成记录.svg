 160)" textLength="48" lengthAdjust="spacingAndGlyphs" xml:space="preserve">结束日期</text><rect x="394" y="226.78125" width="235" height="40" rx="7" fill="rgb(255,255,255)" fill-opacity="1" stroke="rgb(220, 226, 236)" stroke-width="1"/><text x="407" y="252.28125" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="400" fill="rgb(24, 35, 56)" textLength="77.79296875" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2026-10-02</text><rect x="647" y="226.59375" width="102" height="40" rx="7" fill="rgb(29,78,216)" fill-opacity="1" stroke="rgb(37, 99, 235)" stroke-width="1"/><text x="670" y="251.390625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="500" fill="rgb(255, 255, 255)" textLength="56" lengthAdjust="spacingAndGlyphs" xml:space="preserve">查询统计</text><rect x="759" y="226.59375" width="54" height="40" rx="7" fill="none" fill-opacity="1" stroke="rgba(0, 0, 0, 0)" stroke-width="1"/><text x="772" y="251.390625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="500" fill="rgb(117, 129, 152)" textLength="28" lengthAdjust="spacingAndGlyphs" xml:space="preserve">重置</text><text x="141" y="293.78125" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(151, 161, 178)" textLength="324" lengthAdjust="spacingAndGlyphs" xml:space="preserve">按北京时间归属，包含起始和结束两天；只计入已完成预约。</text><text x="120" y="349.96875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(132, 145, 165)" textLength="60" lengthAdjust="spacingAndGlyphs" xml:space="preserve">统计区间：</text><text x="180" y="349.96875" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="500" fill="rgb(82, 99, 126)" textLength="152.46875" lengthAdjust="spacingAndGlyphs" xml:spac