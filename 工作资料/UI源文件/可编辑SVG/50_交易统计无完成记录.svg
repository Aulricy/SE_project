, 162, 181)" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve">统计不包含真实付款或收入数据。</text><text x="120" y="932.515625" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="11" font-weight="400" fill="rgb(160, 169, 184)" textLength="328.171875" lengthAdjust="spacingAndGlyphs" xml:space="preserve">离线界面演示 · 统计及日志均使用虚构示例数据，非实时后台数据。</text><rect x="120" y="959.109375" width="1200" height="1" rx="0" fill="rgb(230, 235, 243)" fill-opacity="1" stroke="none" stroke-width="0"/><text x="120" y="992.109375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="500" fill="rgb(133, 144, 162)" textLength="48" lengthAdjust="spacingAndGlyphs" xml:space="preserve">二手集市</text><text x="168" y="992.109375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(154, 163, 178)" textLength="120" lengthAdjust="spacingAndGlyphs" xml:space="preserve">　交易统计与操作追溯</text><text x="1068" y="992.109375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" font-weight="400" fill="rgb(154, 163, 178)" textLength="252" lengthAdjust="spacingAndGlyphs" xml:space="preserve">统计按北京时间归属，操作日志仅支持只读查询</text></svg>