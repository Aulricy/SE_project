function showDetail(id){const p=get(id);if(!p||p.owner!==user){denied();return;}overlay.hidden=true;state.currentId=id;state.dirty=false;setView('detail');app.innerHTML='<div class="breadcrumb"><button id="backList">我的商品</button><span>›</span><span class="here">商品详情</span></div><section class="status-panel"><div class="status-head"><div class="thumb">'+image(p)+'</div><div>'+badge(p)+'<h1>'+esc(p.name||'未命名草稿')+'</h1><p class="status-caption">'+help(p)+'</p></div></div>'+(p.blockReason?'<div class="banner readonly-reason"><b>屏蔽原因</b><br>'+esc(p.blockReason)+'</div>':p.rejectReason?'<div class="banner warning readonly-reason"><b>最近一次驳回原因</b><br>'+esc(p.rejectReason)+'</div>':'')+'<div class="readonly-info"><span>商品编号<b>'+p.id.toUpperCase()+'</b></span><span>商品分类<b>'+esc(p.category||'未填写')+'</b></span><span>商品价格<b>'+(p.price?'¥'+Number(p.price).toFixed(2):'未填写')+'</b></span><span>更新时间<b>'+p.updatedAt+'</b></span></div><div class="readonly-description"><h2 class="section-title">商品描述</h2>'+esc(p.description||'暂未填写商品描述。')+'</div><div class="readonly-actions">'+actionLinks(p)+'</div></section>';app.querySelector('#backList').onclick=renderList;app.querySelectorAll('.readonly-actions [data-view]').forEach(e=>e.remove());bindActions();}

function askAction(id,key){const p=get(id),op=ops[key];if(!p||p.owner!==user||!op||!op.from.includes(p.status)||p.active){denied();return false;}const version=p.version;modal.innerHTML='<div class="modal-head"><h2>'+op.title+'</h2><button id="closeModal" class="close" aria-label="关闭弹窗">✕</button></div><div class="modal-product"><div class="mini-art">'+image(p)+'</div><div class="modal-product-name">'+esc(p.name)+'</div></div><p class="subtle" style="line-height:1.9">'+op.text+'</p><p class="error-message" id="actionError" hidden></p><div class="modal-footer"><button class="btn" id="cancelAction">暂不操作</button><button class="btn primary" id="confirmAction">'+op.label+'</button></div>';overlay.hidden=false;modal.querySelector('#closeModal').onclick=close;modal.querySelector('#cancelAction').onclick=close;modal.querySelector('#confirmAction').onclick=()=>{const current=get(id);if(!current||current.owner!==user||current.version!==version||!op.from.includes(current.status)||current.active){const e=modal.querySelector('#actionError');e.textContent='商品状态已变化，本次操作未生效。请关闭弹窗并刷新列表。';e.hidden=false;return;}current.status=op.to;current.version++;current.updatedAt='2026-10-31 11:00';overlay.hidden=true;if(key==='returnDraft')showEditor(id);else{renderList();toast(key==='withdraw'?'已撤回草稿，可以继续编辑。':'商品已下架。');}};return true;}
