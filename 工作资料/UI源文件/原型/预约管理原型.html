function permitted(r,kind){if(!related(r))return false;if(kind==='confirm'||kind==='reject')return r.seller===user&&r.status==='PENDING_CONFIRMATION';if(kind==='complete')return r.buyer===user&&r.status==='CONFIRMED';if(kind==='cancel')return ACTIVE.includes(r.status);return false;}

function applyAction(req){const r=get(req.id);if(isGuest||!related(r))return requestError('无权操作这条预约。','FORBIDDEN');const key=user+'|'+req.requestKey,fingerprint=JSON.stringify([req.id,req.kind,req.expectedVersion,req.expectedStatus,req.expectedProductVersion,req.reason||'']);const previous=state.requests.get(key);if(previous){if(previous.fingerprint!==fingerprint)return requestError('重复请求内容不一致，请刷新后重试。','KEY_CONFLICT');return {ok:true,replay:true,record:get(previous.recordId)};}
if(!req.requestKey)return requestError('请求标识缺失，请重新打开操作弹窗。');const p=product(r);if(!permitted(r,req.kind))return requestError('当前预约状态或操作权限不允许此操作，请刷新后重试。','STALE');

const time=now();if(req.kind==='confirm'){r.status='CONFIRMED';r.confirmedAt=time;p.status='CONFIRMED';}

async function submitAction(){if(state.busy||!state.modal)return;const req={...state.modal},textarea=modal.querySelector('#cancelReason');if(textarea)req.reason=textarea.value;const reasonError=modal.querySelector('#reasonError');if(reasonError)reasonError.hidden=true;if(['cancel','reject'].includes(req.kind)&&!String(req.reason||'').trim()){reasonError.textContent='请填写原因后再提交。';reasonError.hidden=false;textarea.setAttribute('aria-invalid','true');textarea.focus();return;}if(textarea)textarea.removeAttribute('aria-invalid');state.busy=true;const button=modal.querySelector('#confirmAction');button.disabled=true;button.textContent='正在提交…';modal.querySelector('#cancelAction').disabled=true;modal.querySelector('#closeModal').disabled=true;if(textarea)textarea.disabled=true;

function simulateOtherAction(id,kind){const r=get(id);if(!r||!ACTIVE.includes(r.status))return false;const p=product(r),time=now();if(kind==='confirm'&&r.status==='PENDING_CONFIRMATION'){r.status='CONFIRMED';r.confirmedAt=time;p.status='CONFIRMED';}else if(['cancel','block'].includes(kind)){r.status='CANCELLED';r.cancelledAt=time;r.cancelActor=kind==='block'?'admin_demo':r.buyer;r.cancelReason=kind==='block'?'管理员屏蔽：商品内容违规。':'对方取消了这条预约。';r.cancelType=kind==='block'?'BLOCKING':'USER';p.status=kind==='block'?'BLOCKED':'PUBLISHED';p.activeReservationId=null;}else return false;r.version++;p.version++;return true;}
