</style></head><body><header class="topbar"><div class="top-inner"><a class="brand" id="brand" href="#"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M5 8h14l-1 12H6L5 8Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.7"/></svg></span>二手集市<span class="admin-tag">管理后台</span></a><nav class="top-nav" aria-label="管理员导航"><a id="reviewNav" class="nav-item">待审核商品</a><a id="allNav" class="nav-item">全部商品</a><a id="statsNav" class="nav-item">交易统计</a><a id="logsNav" class="nav-item">操作日志</a><a id="accountsNav" class="nav-item active">管理员账号</a></nav><div class="top-account"><span class="badge CONFIRMED" id="roleTag">管理员</span><span class="avatar">A</span><span class="username">admin_demo</span><a class="plain-link" href="登录注册原型.html">退出登录</a></div></div></header><main id="app" class="container"></main><p class="demo-foot">离线界面演示 · 请使用虚构用户名与演示密码。新增账号仅保留在当前标签页，关闭标签页后清空。</p><footer class="footer"><span><strong>二手集市</strong>　管理员账号授权设置</span><span>仅预置的首个管理员可批准并设置新增管理员</span></footer><div id="overlay" class="overlay" role="dialog" aria-modal="true" hidden><div class="modal" id="modal"></div></div><script src="演示账号会话.js"></script><script>(()=>{'use strict';
const params=new URLSearchParams(location.search),actor=params.get('user')||'admin_demo',guest=params.get('guest')==='1',service=window.DemoAccounts;
const app=document.querySelector('#app'),overlay=document.querySelector('#overlay'),modal=document.querySelector('#modal');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'list',pending:null,busy:false,dirty:false,lastAccount:null},initial=()=>!guest&&service.isInitialAdmin(actor),formatId=id=>'U'+String(id).padStart(3,'0');
function deny(){overlay.hidden=true;state.pending=null;state.view='denied';document.body.dataset.view='denied';const admin=service.isAdmin(actor);app.innerHTML='<section class="empty-card account-denied"><h2>仅首个管理员可以设置管理员账号</h2><p>'+(admin?'当前账号可以审核商品、处理违规并查询统计与日志。<br>增设管理员需要由预置的首个管理员批准并设置。':'请使用预置的首个管理员账号登录后操作。')+'</p><a class="btn primary" href="'+(admin?'管理员商品管理原型.html?user='+encodeURIComponent(actor):'登录注册原型.html')+'">'+(admin?'返回商品管理':'返回登录')+'</a></section>';return false;}
function view(name){document.body.dataset.view=name;state.view=name;window.scrollTo(0,0);}
function close(){if(state.busy)return;overlay.hidden=true;state.pending=null;}
function renderList(){if(!initial())return deny();overlay.hidden=true;state.pending=null;state.dirty=false;view('list');const accounts=service.listAdmins();app.innerHTML='<div class="page-heading"><div><h1>管理员账号</h1><p class="subtle">收到新增管理员申请后，由首个管理员在此批准并设置账号。</p></div><button class="btn primary" id="newAdmin">＋ 批准并设置账号</button></div><div class="account-grid"><section><div class="account-caption"><span>共 '+accounts.length+' 个管理员账号</span><span>账号权限由系统识别</span></div><div class="account-list-panel account-table-panel"><table class="account-table"><thead><tr><th>用户名</th><th>账号编号</th><th>身份</th><th>设置方式</th><th>创建时间</th></tr></thead><tbody>'+accounts.map(a=>'<tr><td class="account-name">'+esc(a.username)+'</td><td class="account-id">'+formatId(a.id)+'</td><td><span class="badge '+(a.id===service.initialAdminId?'CONFIRMED':'DRAFT')+'">'+(a.id===service.initialAdminId?'首个管理员':'管理员')+'</span></td><td>'+(a.id===service.initialAdminId?'平台预置':'经首个管理员批准')+'</td><td class="account-id">'+esc(a.createdAt)+'</td></tr>').join('')+'</tbody></table></div><p class="account-rule">普通用户注册只创建普通账号。已被使用的用户名不能用于新建管理员账号。</p></section><aside class="account-aside"><section class="side-card"><h3>当前授权人</h3><div class="side-status"><span class="badge CONFIRMED">首个管理员</span></div><p>'+esc(actor)+' · '+formatId(service.initialAdminId)+'</p><p>只有该预置账号可以批准并设置后续管理员。</p></section><section class="side-card"><h3>管理员权限</h3><p>审核商品、处理违规商品，以及查询全平台交易统计和操作日志。</p><p>新增管理员不能继续增设其他管理员。</p></section></aside></div>';app.querySelector('#newAdmin').onclick=renderForm;return true;}
const field=(id,label,type,placeholder)=>'<div class="editor-field"><label class="editor-label" for="'+id+'"><span class="required">*</span>'+label+'</label><input class="field" id="'+id+'" type="'+type+'" placeholder="'+placeholder+'" autocomplete="'+(type==='password'?'new-password':'off')+'" aria-describedby="'+id+'Error"><p class="field-error" id="'+id+'Error" hidden></p></div>';
function renderForm(){if(!initial())return deny();overlay.hidden=true;state.pending=null;state.dirty=false;view('editor');app.innerHTML='<div class="breadcrumb"><button id="backList">管理员账号</button><span>›</span><span class="here">批准并设置账号</span></div><div class="page-heading"><div><h1>批准并设置管理员账号</h1><p class="subtle">核对申请人信息后，设置其登录用户名和密码。</p></div><span class="badge CONFIRMED">仅首个管理员可操作</span></div><div class="account-grid"><section class="account-panel"><div class="authority-note">本次批准及设置人：<b>'+esc(actor)+'</b> · '+formatId(service.initialAdminId)+'</div><h2>新账号信息</h2><form id="adminAccountForm" class="account-form" novalidate>'+field('adminUsername','用户名','text','填写尚未使用的用户名')+field('adminPassword','登录密码','password','设置该管理员的登录密码')+field('adminConfirm','确认密码','password','请再次输入登录密码')+'<div class="fixed-role"><span>账号身份</span><b>管理员（固定）</b></div><div id="formError" class="account-error" role="alert" hidden></div><div class="form-actions"><button class="btn quiet" id="cancelForm" type="button">返回列表</button><span class="action-spacer"></span><button class="btn primary" id="approveAccount" type="submit">批准并设置</button></div></form></section><aside class="account-aside"><section class="side-card"><h3>授权说明</h3><p>点击“批准并设置”，表示首个管理员批准本次申请并创建管理员账号。</p><p>用户名必须尚未使用；密码与确认密码需要一致。</p></section><section class="side-card"><h3>权限范围</h3><p>新账号可审核商品、处理违规、查询交易统计与操作日志。</p><p>增设管理员的权限仍仅属于预置的首个管理员。</p></section></aside></div>';
app.querySelector('#backList').onclick=()=>leave(renderList);app.querySelector('#cancelForm').onclick=()=>leave(renderList);app.querySelector('#adminAccountForm').onsubmit=e=>{e.preventDefault();prepareApproval();};app.querySelectorAll('input').forEach(e=>e.oninput=()=>{state.dirty=true;e.removeAttribute('aria-invalid');app.querySelector('#'+e.id+'Error').hidden=true;});return true;}
function mark(id,message){const e=app.querySelector('#'+id);e.setAttribute('aria-invalid','true');const error=app.querySelector('#'+id+'Error');error.textContent=message;error.hidden=false;}
function prepareApproval(){if(state.busy)return;if(!initial())return deny();app.querySelectorAll('.field-error').forEach(e=>e.hidden=true);app.querySelectorAll('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));app.querySelector('#formError').hidden=true;
const username=app.querySelector('#adminUsername').value.trim(),password=app.querySelector('#adminPassword').value,confirm=app.querySelector('#adminConfirm').value;let valid=true;if(!username){mark('adminUsername','请填写用户名。');valid=false;}if(!password){mark('adminPassword','请设置登录密码。');valid=false;}if(!confirm){mark('adminConfirm','请再次输入登录密码。');valid=false;}else if(password!==confirm){mark('adminConfirm','两次输入的密码不一致。');valid=false;}if(username&&service.find(username)){mark('adminUsername','该用户名已被使用，请填写一个新用户名。');valid=false;}if(!valid){app.querySelector('[aria-invalid=true]').focus();return false;}
state.pending={username,password};modal.innerHTML='<div class="modal-head"><h2>确认批准并设置账号？</h2><button class="close" id="closeApproval" aria-label="关闭弹窗">✕</button></div><div class="approval-detail"><div class="approval-line"><span>新用户名</span><b>'+esc(username)+'</b></div><div class="approval-line"><span>账号身份</span><b>管理员</b></div><div class="approval-line"><span>批准及设置人</span><b>'+esc(actor)+' · 首个管理员</b></div></div><div class="modal-account-note">确认后，新账号可以审核商品、处理违规并查询全平台统计和日志。增设管理员仍只能由预置的首个管理员操作。</div><p class="approval-note">设置成功后，新账号可使用所设置的密码登录。</p><div id="approvalError" class="account-error" role="alert" hidden></div><div class="modal-footer"><button class="btn" id="cancelApproval">返回核对</button><button class="btn primary" id="confirmApproval">确认批准并设置</button></div>';overlay.hidden=false;modal.querySelector('#closeApproval').onclick=close;modal.querySelector('#cancelApproval').onclick=close;modal.querySelector('#confirmApproval').onclick=commit;return true;}
async function commit(){if(state.busy||!state.pending)return;state.busy=true;for(const id of ['closeApproval','cancelApproval','confirmApproval'])modal.querySelector('#'+id).disabled=true;modal.querySelector('#confirmApproval').textContent='正在设置…';const payload=state.pending;const result=await service.createAdmin(actor,payload.username,payload.password);state.busy=false;if(!result.ok){if(result.code==='DUPLICATE'){close();mark('adminUsername',result.message);app.querySelector('#adminUsername').focus();return;}if(result.code==='FORBIDDEN'){state.pending=null;deny();return;}modal.querySelector('#approvalError').textContent=result.message;modal.querySelector('#approvalError').hidden=false;for(const id of ['closeApproval','cancelApproval','confirmApproval'])modal.querySelector('#'+id).disabled=false;modal.querySelector('#confirmApproval').textContent='确认批准并设置';return;}state.lastAccount=result.account;state.pending=null;state.dirty=false;showSuccess(result.account);}
function showSuccess(account){overlay.hidden=true;view('success');app.innerHTML='<section class="account-success"><div class="success-icon">✓</div><h1>已批准并设置管理员账号</h1><p class="subtle">新账号已具备管理员权限，可使用所设置的密码登录。</p><div class="approval-detail"><div class="approval-line"><span>用户名</span><b>'+esc(account.username)+'</b></div><div class="approval-line"><span>账号编号</span><b>'+formatId(account.id)+'</b></div><div class="approval-line"><span>身份</span><b>管理员</b></div><div class="approval-line"><span>批准及设置人</span><b>'+esc(actor)+'</b></div><div class="approval-line"><span>设置时间（北京时间）</span><b>'+esc(account.createdAt)+'</b></div></div><div class="success-actions"><a class="btn primary" id="loginNewAccount" href="登录注册原型.html?username='+encodeURIComponent(account.username)+'">前往登录</a><button class="btn" id="returnAccounts">返回管理员列表</button></div><p class="success-tip">该账号可审核商品、处理违规及查询统计与日志。增设其他管理员仍需要由预置的首个管理员批准并设置。</p></section>';app.querySelector('#returnAccounts').onclick=renderList;}
function leave(action){if(!state.dirty){action();return;}modal.innerHTML='<div class="modal-head"><h2>离开当前填写？</h2></div><p class="subtle">本次填写尚未批准或设置，可以继续核对账号信息。</p><div class="modal-footer"><button class="btn" id="keepForm">继续填写</button><button class="btn primary" id="discardForm">放弃填写并离开</button></div>';overlay.hidden=false;modal.querySelector('#keepForm').onclick=close;modal.querySelector('#discardForm').onclick=()=>{state.dirty=false;close();action();};}
const encoded=encodeURIComponent(actor),paths={brand:'管理员商品管理原型.html?user='+encoded,reviewNav:'管理员商品管理原型.html?user='+encoded,allNav:'管理员商品管理原型.html?view=all&user='+encoded,statsNav:'统计与日志原型.html?user='+encoded,logsNav:'统计与日志原型.html?view=logs&user='+encoded};for(const [id,path] of Object.entries(paths)){const e=document.querySelector('#'+id);e.href=path;e.onclick=event=>{event.preventDefault();leave(()=>location.href=path);};}document.querySelector('#accountsNav').hidden=!initial();document.querySelector('#accountsNav').onclick=e=>{e.preventDefault();leave(renderList);};document.querySelector('.username').textContent=actor;document.querySelector('.avatar').textContent=actor[0].toUpperCase();document.querySelector('#roleTag').textContent=initial()?'首个管理员':service.isAdmin(actor)?'管理员':'普通用户';overlay.onclick=e=>{if(e.target===overlay)close();};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue='';}});
window.__adminAccounts={state,renderList,renderForm,prepareApproval};
if(guest)location.replace('登录注册原型.html');else if(!initial())deny();else if(params.get('view')==='new')renderForm();else renderList();
})();</script></body></html>
