function emptyArt(unavailable){return "<svg class='empty-art' viewBox='0 0 150 125' fill='none'><ellipse cx='76' cy='112' rx='56' ry='7' fill='#edf1f7'/><rect x='32' y='23' width='83' height='76' rx='10' fill='#f2f6fc' stroke='#d7e1ef' stroke-width='2'/><path d='M47 44h50M47 57h35M47 70h44' stroke='#ccd9ea' stroke-width='5' stroke-linecap='round'/><circle cx='108' cy='88' r='24' fill='#e8effc' stroke='white' stroke-width='4'/>"+(unavailable?"<path d='m99 79 18 18m0-18-18 18' stroke='#89a6d1' stroke-width='4' stroke-linecap='round'/>":"<circle cx='105' cy='85' r='10' stroke='#89a6d1' stroke-width='3'/><path d='m113 93 10 10' stroke='#89a6d1' stroke-width='4' stroke-linecap='round'/>")+"</svg>";}
function statusOf(id){return state.server[id]||"PUBLISHED";}
function getProduct(id){return DATA.find(function(p){return p.id===id;});}
function toast(message,error){const t=document.getElementById("toast");t.innerHTML=(error?icons.info:icons.check)+'<span>'+esc(message)+'</span>';t.className="toast"+(error?" error":"");t.hidden=false;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(function(){t.hidden=true;},3500);}
function closeModal(){overlay.hidden=true;state.busy=false;}
function hideToast(){document.getElementById("toast").hidden=true;clearTimeout(window.__toastTimer);}
function setView(name){document.body.dataset.view=name;document.getElementById("hallNav").classList.toggle("active",true);}
function card(p){return '<article class="product" tabindex="0" data-id="'+p.id+'" aria-label="查看'+esc(p.title)+'详情"><div class="art">'+art(p)+'</div><div class="product-body"><h2 class="product-title">'+esc(p.title)+'</h2><div class="product-mid">'+price(p.price)+'<span class="cat-chip">'+p.category+'</span></div><div class="product-bottom"><span>'+p.date+' 发布</span><span class="detail-link">查看详情'+icons.arrow+'</span></div></div></article>';}
function readQuery(){return {keyword:document.getElementById("keyword").value.trim(),category:state.query.category,min:document.getElementById("minPrice").value,max:document.getElementById("maxPrice").value,page:1};}
function applyFilters(category){
 const q=readQuery();if(category)q.category=category;
 const error=document.getElementById("filterError");
 if(q.min!==""&&q.max!==""&&Number(q.min)>Number(q.max)){error.textContent="最低价不能高于最高价，请调整价格范围。";error.hidden=false;return;}
 if((q.min!==""&&Number(q.min)<0)||(q.max!==""&&Number(q.max)<0)){error.textContent="价格范围不能为负数，请重新填写。";error.hidden=false;return;}
 state.query=q;renderList();
}
function renderList(){
 closeModal();state.currentId=null;state.stale=false;
 const q=state.query,filtered=DATA.filter(function(p){return statusOf(p.id)==="PUBLISHED"&&(!q.keyword||p.title.indexOf(q.keyword)!==-1)&&(q.category==="全部"||p.category===q.category)&&(q.min===""||p.price>=Number(q.min))&&(q.max===""||p.price<=Number(q.max));});
 const pages=Math.max(1,Math.ceil(filtered.length/6));q.page=Math.min(q.page,pages);
 const visible=filtered.slice((q.page-1)*6,q.page*6);
 setView(filtered.length?"list":"empty");
 const categories=["全部","数码","图书","生活用品","服饰","其他"];
 let html='<div class="page-heading"><div><h1>商品大厅</h1><p class="subtle">浏览已发布商品，找到合适的闲置好物。</p></div><span class="heading-side">'+icons.check+'公开展示的商品均已通过审核</span></div>';
 html+='<section class="filter-panel" aria-label="商品筛选"><form id="filterForm"><div class="filter-main"><div class="search-wrap">'+icons.search+'<input id="keyword" class="field" aria-label="商品名称关键词" placeholder="搜索商品名称，例如：教材、台灯" value="'+esc(q.keyword)+'"></div><span class="price-label">价格</span><input id="minPrice" class="field price-input" type="number" min="0" step="0.01" aria-label="最低价" placeholder="最低价" value="'+esc(q.min)+'"><span class="range-sep">—</span><input id="maxPrice" class="field price-input" type="number" min="0" step="0.01" aria-label="最高价" placeholder="最高价" value="'+esc(q.max)+'"><button type="submit" class="btn primary">查询</button><button type="button" id="reset" class="btn quiet">重置</button></div><p id="filterError" class="field-error" hidden></p><div class="category-row"><span class="category-label">商品分类</span>'+categories.map(function(c){return '<button type="button" class="category '+(c===q.category?"selected":"")+'" data-category="'+c+'">'+c+'</button>';}).join("")+'</div></form></section>';
 html+='<div class="results-head"><span>共 <strong>'+filtered.length+'</strong> 件商品</span><span class="sort-note">'+icons.sort+'按发布时间从新到旧</span></div>';
 if(visible.length){
  html+='<section class="products" aria-label="商品列表">'+visible.map(card).join("")+'</section><div class="pager"><button class="page-btn" id="prev" '+(q.page===1?"disabled":"")+'>上一页</button>';
  for(let n=1;n<=pages;n++)html+='<button class="page-btn '+(n===q.page?"current":"")+'" data-page="'+n+'">'+n+'</button>';
  html+='<button class="page-btn" id="next" '+(q.page===pages?"disabled":"")+'>下一页</button><span class="pager-text">第 '+q.page+' / '+pages+' 页</span></div>';
 }else html+='<section class="empty-card">'+emptyArt(false)+'<h2>没有找到匹配的商品</h2><p>试试其他关键词，或调整分类和价格范围。</p><button class="btn primary" id="emptyReset">重置筛选条件</button></section>';
 app.innerHTML=html;
 document.getElementById("filterForm").addEventListener("submit",function(e){e.preventDefault();applyFilters();});
 document.getElementById("reset").onclick=function(){state.query={keyword:"",category:"全部",min:"",max:"",page:1};renderList();};
 document.querySelectorAll("[data-category]").forEach(function(el){el.onclick=function(){applyFilters(el.dataset.category);};});
 document.querySelectorAll("[data-id]").forEach(function(el){el.onclick=function(){renderDetail(el.dataset.id);};el.onkeydown=function(e){if(e.key==="Enter")renderDetail(el.dataset.id);};});
 document.querySelectorAll("[data-page]").forEach(function(el){el.onclick=function(){state.query.page=Number(el.dataset.page);renderList();};});
 const prev=document.getElementById("prev"),next=document.getElementById("next");if(prev)prev.onclick=function(){state.query.page--;renderList();};if(next)next.onclick=function(){state.query.page++;renderList();};
 const reset=document.getElementById("emptyReset");if(reset)reset.onclick=document.getElementById("reset").onclick;
 window.scrollTo(0,0);
}
function renderDetail(id){
 const p=getProduct(id);if(!p){renderUnavailable();return;}
 const ownBooking=state.bookings[id]||null;
 if(statusOf(id)!=="PUBLISHED"&&!ownBooking){renderUnavailable();return;}
 closeModal();state.currentId=id;state.detailVersion=state.versions[id]||1;state.stale=false;setView("detail");
 const own=p.seller===currentUser,reserved=!!ownBooking;
 let action=own?'<button class="btn reserve-btn" id="ownProduct">这是你发布的商品</button>':reserved?'<button class="btn primary reserve-btn" id="viewBooking">查看预约</button>':'<button class="btn primary reserve-btn" id="reserve">'+icons.check+'立即预约</button>';
 app.innerHTML='<div class="breadcrumb"><button id="backList">商品大厅</button>'+icons.arrow+'<span class="here">商品详情</span></div><section class="detail-card"><div><div class="gallery">'+art(p)+'</div><p class="image-caption">'+icons.image+'商品图片</p></div><div class="detail-info"><span class="status '+(reserved?"reserved":"")+'"><span class="dot"></span>'+(reserved?"已预约 · 待卖家确认":"已发布 · 可预约")+'</span><h1>'+esc(p.title)+'</h1><div class="detail-price-wrap">'+price(p.price,"detail-price")+'<span class="price-caption">商品价格</span></div><div class="meta-list"><div class="meta-row"><span class="meta-label">商品分类</span><span class="meta-value">'+p.category+'</span></div><div class="meta-row"><span class="meta-label">卖家</span><span class="meta-value"><span class="seller-icon">'+p.seller[0].toUpperCase()+'</span>'+p.seller+'</span></div><div class="meta-row"><span class="meta-label">发布时间</span><span class="meta-value">'+p.date+'</span></div></div><div class="detail-action" id="detailAction">'+action+'<p class="action-note">'+icons.info+(reserved?"预约记录已保留，可从“我的预约”查看":"预约代表购买意向，付款与交付在线下进行")+'</p></div></div></section><section class="description"><h2 class="section-title">商品描述</h2><p class="description-text">'+esc(p.description)+'</p><p class="description-tip">'+icons.info+'联系方式和交付说明由卖家填写，买卖双方据此自行联系。</p></section>';
 document.getElementById("backList").onclick=function(){hideToast();renderList();};
 const reserve=document.getElementById("reserve");if(reserve){reserve.onclick=openConfirm;if(isGuest)reserve.innerHTML="登录后预约";}
 const view=document.getElementById("viewBooking");if(view)view.onclick=showBooking;
 window.scrollTo(0,0);
}
function renderUnavailable(){
 closeModal();state.currentId=null;setView("unavailable");
 app.innerHTML='<div class="breadcrumb"><button id="backList">商品大厅</button>'+icons.arrow+'<span class="here">商品详情</span></div><section class="empty-card unavailable">'+emptyArt(true)+'<h2>商品暂不可用</h2><p>商品可能已被预约、下架或屏蔽。<br>请返回商品大厅，查看其他已发布商品。</p><button id="returnHall" class="btn primary">'+icons.back+'返回商品大厅</button></section>';
 document.getElementById("backList").onclick=renderList;document.getElementById("returnHall").onclick=renderList;window.scrollTo(0,0);
}
function openConfirm(){
 if(state.busy)return;
 if(isGuest){goLogin(true);return;}
 const p=getProduct(state.currentId);if(!p||p.seller===currentUser)return;state.clicks++;
 modal.innerHTML='<div class="modal-head"><h2>确认预约</h2><button class="close" id="closeModal" aria-label="关闭弹窗">'+icons.close+'</button></div><p class="subtle">请确认商品和预约价格。</p><div class="modal-product"><div class="mini-art">'+art(p)+'</div><div><div class="modal-product-name">'+esc(p.title)+'</div>'+price(p.price,"modal-price")+'<div class="modal-label">本次预约价格</div></div></div><div class="modal-note">'+icons.info+'<span><strong>预约仅表示购买意向，不产生线上付款。</strong><br>卖家确认后，请按商品描述自行联系，安排线下付款和交付。</span></div><div class="modal-footer"><button class="btn" id="cancelConfirm">再看看</button><button class="btn primary" id="confirmReserve">确认预约</button></div>';
 overlay.hidden=false;document.getElementById("closeModal").onclick=closeModal;document.getElementById("cancelConfirm").onclick=closeModal;document.getElementById("confirmReserve").onclick=confirmReserve;
}
function confirmReserve(){
 if(isGuest){goLogin(true);return;}
 if(state.busy)return;state.busy=true;state.attempts++;state.clicks++;
 const id=state.currentId,p=getProduct(id),button=document.getElementById("confirmReserve");button.disabled=true;button.textContent="正在提交…";
 setTimeout(function(){
  if(statusOf(id)!=="PUBLISHED"){closeModal();renderUnavailable();toast("商品状态已变化，本次预约未成功。",true);return;}
  if((state.versions[id]||1)!==state.detailVersion){
   closeModal();state.stale=true;
   document.getElementById("detailAction").innerHTML='<button id="refreshDetail" class="btn primary reserve-btn">刷新商品信息</button><p class="action-note">商品信息已变化，请刷新后重新预约。</p>';
   document.getElementById("refreshDetail").onclick=function(){renderDetail(id);};toast("商品信息已变化，本次预约未成功。",true);return;
  }
  if(!state.bookings[id])state.bookings[id]={id:"R-20261031-"+String(++state.bookingIndex).padStart(3,"0"),productId:id,price:p.price,status:"待卖家确认",createdAt:"2026-10-31 10:30"};
  state.booking=state.bookings[id];
  state.server[id]="RESERVED";state.versions[id]=(state.versions[id]||1)+1;closeModal();renderDetail(id);toast("预约成功，等待卖家确认。",false);
 },250);
}
function showBooking(){
 if(isGuest){goLogin(false);return;}
 const target=new URLSearchParams({user:currentUser,tab:"bought"}),b=state.bookings[state.currentId]||state.booking,p=b?getProduct(b.productId):null;
 const entries=Object.values(state.bookings).map(function(record){const item=getProduct(record.productId);return {id:record.id,productId:item.id,name:item.title,category:item.category,price:record.price,buyer:currentUser,seller:item.seller,description:item.description,art:item.art,createdAt:record.createdAt};});
 if(entries.length)target.set("entries",JSON.stringify(entries));
 if(b&&p)target.set("record",b.id);
 location.href="预约管理原型.html?"+target.toString();
}

overlay.addEventListener("click",function(e){if(e.target===overlay&&!state.busy)closeModal();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!state.busy)closeModal();});
document.getElementById("brand").onclick=document.getElementById("hallNav").onclick=function(e){e.preventDefault();hideToast();renderList();};
document.getElementById("myBookings").onclick=showBooking;
window.__prototype={state:state,products:DATA,renderList:renderList,renderDetail:renderDetail,renderUnavailable:renderUnavailable,openConfirm:openConfirm,hideToast:hideToast,reset:function(){state.query={keyword:"",category:"全部",min:"",max:"",page:1};state.booking=null;state.bookings={};state.bookingIndex=0;state.server={};state.versions={};state.busy=false;state.attempts=0;state.clicks=0;hideToast();renderList();},setServerStatus:function(id,status){state.server[id]=status;},bumpVersion:function(id){state.versions[id]=(state.versions[id]||1)+1;}};
const query=new URLSearchParams(location.search),view=query.get("view");
if(view==="detail")renderDetail(query.get("product")||"p1");else if(view==="unavailable")renderUnavailable();else if(view==="empty"){state.query.keyword="未找到的商品";renderList();}else renderList();
})();
</script>
