<script src="演示账号会话.js"></script><script>
(()=>{'use strict';
const app=document.querySelector('#auth'),state={view:'login',account:null,busy:false},accounts=new Map();
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function verifier(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:10000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function addAccount(username,password,role){const salt=crypto.getRandomValues(new Uint8Array(16));accounts.set(username,{salt,hash:await verifier(password,salt),role});}
const ready=Promise.all([addAccount('chen_demo','Demo123!','MEMBER'),addAccount('admin_demo','Demo123!','ADMIN'),addAccount('reviewer_demo','Demo123!','ADMIN')]);
const field=(name,label,type,placeholder)=>'<div class="form-group"><label for="'+name+'">'+label+'</label><input class="field" id="'+name+'" name="'+name+'" type="'+type+'" placeholder="'+placeholder+'" autocomplete="'+(type==='password'?(name==='password'&&state.view==='login'?'current-password':'new-password'):'username')+'" aria-describedby="'+name+'Error"><p class="field-error" id="'+name+'Error" hidden></p></div>';
function show(view,username=''){state.view=view;state.busy=false;document.body.dataset.view=view;
const register=view==='register';app.innerHTML='<h2>'+(register?'创建账号':'欢迎回来')+'</h2><p class="subtitle">'+(register?'注册后即可发布商品或预约他人的商品。':'登录后，继续管理商品和预约。')+'</p><form id="authForm" novalidate>'+field('username','用户名','text','请输入用户名')+field('password','密码','password',register?'设置登录密码':'请输入密码')+(register?field('confirm','确认密码','password','请再次输入密码'):'')+'<div id="formError" class="error-box" role="alert" hidden></div><button class="btn primary auth-submit" type="submit">'+(register?'注册账号':'登录')+'</button></form><p class="switch">'+(register?'已有账号？':'还没有账号？')+' <button id="switch" class="plain-link">'+(register?'去登录':'创建账号')+'</button></p><p class="policy">'+(register?'普通注册创建普通用户账号，同一账号可作为买家或卖家。':'普通用户与管理员使用同一登录入口，系统识别账号权限。')+'</p>';
app.querySelector('#username').value=username;app.querySelector('#switch').onclick=()=>show(register?'login':'register',app.querySelector('#username').value);app.querySelector('#authForm').onsubmit=submit;}
function error(name,message){const el=document.getElementById(name),text=document.getElementById(name+'Error');el.setAttribute('aria-invalid','true');text.textContent=message;text.hidden=false;}
function clearErrors(){app.querySelectorAll('.field-error,#formError').forEach(e=>e.hidden=true);app.querySelectorAll('input').forEach(e=>e.removeAttribute('aria-invalid'));}
async function submit(e){e.preventDefault();if(state.busy)return;clearErrors();const username=app.querySelector('#username').value.trim(),password=app.querySelector('#password').value,register=state.view==='register';let valid=true;
if(!username){error('username','请填写用户名。');valid=false;}if(!password){error('password','请填写密码。');valid=false;}if(register){const confirm=app.querySelector('#confirm').value;if(!confirm){error('confirm','请再次输入密码。');valid=false;}else if(confirm!==password){error('confirm','两次输入的密码不一致。');valid=false;}}
if(!valid){app.querySelector('[aria-invalid=true]').focus();return;}
state.busy=true;const button=app.querySelector('button[type=submit]');button.disabled=true;button.textContent=register?'正在注册…':'正在登录…';
try{await ready;if(register){if(accounts.has(username)||window.DemoAccounts.find(username)){error('username','该用户名已被使用，请换一个。');return;}const saved=await window.DemoAccounts.registerMember(username,password);if(!saved.ok){error('username',saved.message);return;}state.account={username,role:'MEMBER'};showSuccess(true);}else{const record=accounts.get(username);const valid=record?record.hash===await verifier(password,record.salt):await window.DemoAccounts.verify(username,password);if(!valid){const box=app.querySelector('#formError');box.textContent='用户名或密码错误，请检查后重试。';box.hidden=false;return;}state.account={username,role:record?record.role:window.DemoAccounts.find(username).role};showSuccess(false);}}
