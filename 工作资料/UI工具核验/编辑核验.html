<!doctype html><html lang="zh"><meta charset="utf-8"><title>实验二 UI 工具核验</title><style>html,body{margin:0;height:100%;font:14px "Microsoft YaHei",sans-serif;background:#f8fafc}header{padding:10px 16px;background:white;border-bottom:1px solid #d9e0e8}h1{font-size:17px;margin:0 0 8px}button{margin:2px 5px 2px 0;padding:6px 10px;border:1px solid #b8c3d2;background:#fff;border-radius:4px;cursor:pointer}button.active{background:#2563eb;color:white}#status{margin:6px 0;color:#334155}iframe{display:block;width:100%;height:calc(100vh - 135px);border:0}#summary{font-size:12px;color:#556070}</style><header><h1>实验二 UI 工具核验</h1><div id="files"></div><button id="inspect">核验全部页面</button><button id="preview">导出核验图</button><button id="fit">适合窗口</button><span id="summary">正在载入官方 diagrams.net 编辑器；源文件保持原样，编辑结果保存到本地核验副本。</span><div id="status" role="status">等待编辑器初始化</div></header><iframe title="diagrams.net 编辑器" src="https://embed.diagrams.net/?embed=1&proto=json&spin=1&stealth=1&local=1&lang=zh&ui=kennedy&libraries=1&noExitBtn=1"></iframe><script>
const iframe=document.querySelector('iframe'),status=document.querySelector('#status'),summary=document.querySelector('#summary');let selected='',ready=false;
function send(d){iframe.contentWindow.postMessage(JSON.stringify(d),'https://embed.diagrams.net')}
async function load(name){selected=name;for(const b of document.querySelectorAll('[data-file]'))b.classList.toggle('active',b.dataset.file===name);const xml=await(await fetch('/source?name='+encodeURIComponent(name))).text();status.textContent='正在打开 '+name;send({action:'load',xml,title:name,autosave:1,fit:1,saveAndExit:0,noExitBtn:1,exportProtocol:true,zoomEvents:true})}
fetch('/files').then(r=>r.json()).then(files=>{for(const f of files){const b=document.createElement('button');b.textContent=f.name.replace('界面.drawio','')+'（'+f.pages+'页）';b.dataset.file=f.name;b.onclick=()=>load(f.name);document.querySelector('#files').append(b)}});
window.addEventListener('message',async e=>{if(e.origin!=='https://embed.diagrams.net'||e.source!==iframe.contentWindow)return;let d;try{d=JSON.parse(e.data)}catch{return}if(d.event==='init'){ready=true;status.textContent='编辑器已就绪，请选择界面源文件';return}if(!selected)return;if(['load','autosave','save','export'].includes(d.event)){const result=await(await fetch('/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...d,file:selected})})).json();if(d.event==='load')status.textContent='已在 diagrams.net 打开 '+selected;if(d.event==='autosave')status.textContent='编辑已同步到本地测试副本：'+selected;if(d.event==='save')status.textContent='已保存本地编辑测试副本：'+selected;if(d.event==='export')summary.textContent=d.format==='json'?'编辑器原生导出核验完成：'+result.pageCount+' 个页面；原始源文件未覆盖。':'编辑器原生核验图已导出：'+selected}});
document.querySelector('#inspect').onclick=()=>{status.textContent='请求编辑器原生导出全部页面结构';send({action:'export',format:'json',allPages:true,includeData:true,compressed:false})};
document.querySelector('#preview').onclick=()=>send({action:'export',format:'png',currentPage:true,border:8,scale:1});document.querySelector('#fit').onclick=()=>send({action:'fit',border:15,maxScale:0.4});</script></html>
